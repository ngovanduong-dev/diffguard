[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "diffguard"
version = "0.1.0"
description = "Automated code review pipeline combining differential static analysis, AST context extraction, and LLM verification for Python pull requests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "bandit>=1.8.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "ruff>=0.8.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "matplotlib>=3.9.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[project.scripts]
diffguard = "diffguard.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/diffguard"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
